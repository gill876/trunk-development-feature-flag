name: CI

on:
  pull_request:
    paths-ignore: [ "**.md", "docs/**" ]
  push:
    branches: [ main ]
    paths-ignore: [ "**.md", "docs/**" ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@2.58.0 lint

  # During a canary, old and new revisions answer side by side, so an API change must not break
  # anyone still talking to the old one. oasdiff compares this branch's spec with the base branch's.
  api_breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail on breaking API changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/$BASE_REF:openapi/openapi.yaml" > "$RUNNER_TEMP/base.yaml" 2>/dev/null; then
            echo "$BASE_REF has no openapi/openapi.yaml yet, so nothing can break."
            exit 0
          fi
          docker run --rm -v "$RUNNER_TEMP:/base" -v "$PWD/openapi:/head" tufin/oasdiff:v1.33.0 \
            breaking /base/base.yaml /head/openapi.yaml --fail-on ERR

  # Trunk-based: every merge to main ships a canary at 0% traffic. Promoting it is up to you
  # (make canary PCT=10, make promote). The repo variables come from `make setup GITHUB_REPO=...`.
  deploy:
    needs: [ scan_ruby, lint, test, openapi ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write # lets GitHub prove to Google which repo and branch this is; no JSON key needed
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Ship a canary at 0%
        run: make ship

      # The canary has no traffic yet, so this is the moment to catch a broken API: if this
      # step fails, don't promote. Schemathesis needs Python 3.11+; the runner has it.
      - name: Check the canary against the OpenAPI spec
        run: make contract
