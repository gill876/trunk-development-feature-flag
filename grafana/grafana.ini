# Grafana's settings for the Flagship demo. Anything not set here is Grafana's default.

[server]
http_port = 3000

[security]
# The password comes from GF_SECURITY_ADMIN_PASSWORD: the same secret as the Flagship Control
# dashboard (make password), so one login opens both.
admin_user = flagship
cookie_secure = true
disable_gravatar = true

[users]
allow_sign_up = false
default_theme = system

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /tmp/dashboards/canary.json

# No alert rules here: Sentry emails new errors. Grafana alerts would query Cloud Monitoring
# every minute, which is fine, but nothing would act on them yet.
[unified_alerting]
enabled = false

# Don't phone home, and don't download plugins on start (cold starts stay short).
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true

[log]
mode = console
